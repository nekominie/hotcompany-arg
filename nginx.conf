# Bloque para reports.fisinor.com
server {
    listen       80;
    listen  [::]:80;
    server_name  reportes.fisinor.com reportes.localhost;

    root   /usr/share/nginx/html;
    index  reports.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cacheo para assets con hash (JS/CSS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a la API de FISINOR
    location /api/ {
        proxy_pass http://fisinor-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 200M;
    }

    # Fallback: reports.html es la SPA de reportes
    location / {
        try_files $uri $uri/ /reports.html;
    }

    # Manejo simple de errores
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# Bloque por defecto para fisinor.com / landing principal
server {
    listen       80;
    listen  [::]:80;
    server_name  fisinor.com localhost _;

    # Directorio raíz con la SPA compilada
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cacheo para assets con hash (JS/CSS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a la API de FISINOR
    location /api/ {
        proxy_pass http://fisinor-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 200M;
    }

    # SPA fallback: todas las rutas devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manejo simple de errores
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
